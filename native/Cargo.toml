[package]
name = "codex-tls"
version = "0.1.0"
edition = "2021"
description = "Codex TLS addon - HTTP client with rustls matching Codex Desktop fingerprint"
authors = ["CCR Team"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
rustls = "=0.23.36"
hyper-rustls = "=0.27.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
napi = { version = "=2", features = ["napi4", "tokio_rt"] }
napi-derive = "=2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"

[build-dependencies]
napi-build = "=2"

[profile.release]
lto = true
opt-level = 3
strip = true
